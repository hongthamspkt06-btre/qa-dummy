<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA Dummy Update</title>
<style>
:root{
  --navy:#1B3A63; --blue-accent:#2E6FB5; --bg:#D5D8DC; --card:#fff;
  --text:#1F2937; --muted:#6B7280; --border:#E2E5E9;
  --good:#1E8E5A; --warn:#C0392B; --amber:#B7791F;
  --green-dim:#E7F5EC; --red-dim:#FBEAEA; --amber-dim:#F6ECD9;
  --panel2:#F7F9FB; --mono:Consolas,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","Malgun Gothic",Arial,sans-serif;background:var(--bg);color:var(--text);padding:24px;padding-top:4.76mm}
.wrap{max-width:1180px;margin:0 auto}
header{background:var(--navy);color:#fff;border-radius:10px;padding:10.5px 26px;margin-bottom:4.76mm;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:19px;letter-spacing:.3px}
header .sub{font-size:12px;color:#B9C7D9;margin-top:4px}
.actions{display:flex;gap:10px}
button{font-family:inherit;cursor:pointer;border:none;border-radius:7px;padding:10px 16px;font-size:13px;font-weight:600;transition:.15s}
.btn-primary{background:var(--blue-accent);color:#fff}.btn-primary:hover{background:#255a94}
.btn-export{background:#1E8E5A;color:#fff}.btn-export:hover{background:#166b44}
.btn-export:disabled{opacity:.6;cursor:default}
.btn-del{background:#F5E4E2;color:var(--warn);width:24px;height:24px;padding:0;font-size:13px;font-weight:700;line-height:1;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.btn-del:hover{background:#eecdc9}
.btn-del:disabled{opacity:.5;cursor:default}
.btn-plain{background:#EEF1F4;color:var(--navy)}.btn-plain:hover{background:#E2E7EC}
.tab-bar{display:flex;align-items:center;gap:8px;margin-bottom:4.76mm}
.tab-btn{padding:9px 20px;background:#EEF1F4;color:var(--navy);border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.tab-btn.active{background:var(--navy);color:#fff}
.count{display:inline-block;margin-left:8px;font-size:12px;background:rgba(0,0,0,.08);border-radius:10px;padding:1px 7px}
.tab-btn.active .count{background:rgba(255,255,255,.22)}
.grid{display:grid;grid-template-columns:340px 1fr;gap:18px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card,.summary-card{background:var(--card);border-radius:10px;padding:17px 20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h2,.summary-card h2{margin:0 0 14px;font-size:14px;color:var(--navy);text-transform:uppercase;letter-spacing:.4px}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px;font-weight:600}
input[type=text],input[type=number],select,textarea{
 width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:6px;
 font-size:13px;font-family:inherit;color:var(--text);background:#fff
}
input:focus,select:focus,textarea:focus{outline:2px solid #BBD3EC;border-color:var(--blue-accent)}
.dropzone{border:2px dashed #A9BBD1;border-radius:8px;padding:16px 14px;text-align:center;color:var(--muted);font-size:12px;background:#F7F9FB;cursor:pointer}
.dropzone.drag{border-color:var(--blue-accent);background:#EAF2FA}
.dropzone img{max-width:100%;max-height:145px;border-radius:6px;margin-bottom:8px}
.dz-actions{display:flex;gap:8px;justify-content:center;margin:8px 0 2px;flex-wrap:wrap}
.dz-btn{background:#fff;color:var(--blue-accent);border:1px solid var(--blue-accent);padding:7px 12px;border-radius:6px;font-size:12px;font-weight:600}
.dz-btn:hover{background:#EAF2FA}
.table-wrap{overflow:auto;max-height:570px;position:relative}
table{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:12px}
th{background:#DCEAF7;color:var(--navy);text-align:center;padding:9px 10px;font-weight:700;border-bottom:2px solid #B9CFE8;position:sticky;top:0;z-index:2}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;overflow:hidden}
td:nth-child(5),td:nth-child(6){text-align:center}
tr:hover td{background:#F7F9FB}
.empty-row td{text-align:center;color:var(--muted);padding:30px;font-style:italic;border-bottom:none}
.photo-thumb{width:54px;height:54px;object-fit:cover;border-radius:6px;border:1px solid var(--border);background:#F7F9FB;cursor:pointer}
.photo-empty{width:54px;height:54px;border:1px dashed var(--border);border-radius:6px;background:#F7F9FB;display:flex;align-items:center;justify-content:center;color:#A0A8B3;font-size:10px}
.chip{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:400;background:#EAF2FA;color:#000}
.category-chip{background:#EEF1F4;color:#000}
.top-row{display:flex;gap:12px;align-items:flex-end;margin-bottom:14px;flex-wrap:wrap}
.top-row .field{flex:1;min-width:130px}.top-row label{margin-top:0}
.summary-section{display:none}.summary-pair{display:flex;gap:18px;flex-wrap:wrap}
.summary-card{flex:1 1 300px}.summary-number{font-size:34px;font-weight:700;color:var(--navy)}
.summary-card-tall{min-height:264px}
.summary-card-short{min-height:240px;padding-top:7px;padding-bottom:7px}
.summary-card-short h2{margin-bottom:5px}
.summary-card h2{text-transform:none;color:#374151;font-weight:700;font-size:13px}
.total-pie-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.total-pie-row .summary-number{flex:0 0 auto}
.total-pie-row #sumBuyerPie{flex:1 1 auto;min-width:0}
/* Giảm chiều cao 5%: khối Add New Dummy + khối trắng bên phải trong .grid */
.grid .card{padding-top:15.83px;padding-bottom:15.83px}
.grid .card label{margin-top:11.17px;margin-bottom:4.66px}
.grid .card input[type=text],.grid .card input[type=number],.grid .card select,.grid .card textarea{padding-top:8.38px;padding-bottom:8.38px}
.grid .card .dropzone{padding-top:14.9px;padding-bottom:14.9px}
.grid .card #btnAdd{margin-top:14.9px}
.grid .card .top-row{margin-bottom:13.03px}
.grid .card .dz-actions{margin-top:7.45px;margin-bottom:1.86px}
.grid .card .table-wrap{max-height:531px}
/* Tiêu đề "Add New Dummy" / "Sign Status": không viết hoa toàn bộ, màu xám đậm */
.card h2.card-title-plain{text-transform:none;color:#374151;font-weight:700;font-size:13px}
.chart-legend-row{display:flex;align-items:center;gap:6px;font-size:11px;margin:3px 0}
.chart-legend-dot{width:10px;height:10px;border-radius:2px;flex:0 0 auto}
.chart-bar-row{margin-bottom:8px}
.chart-bar-track{background:#EEF1F4;border-radius:4px;height:10px;overflow:hidden}
.chart-bar-fill{height:100%;border-radius:4px}
.col-chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:14px}
.col-bar-item{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.col-bar-value{font-size:11px;font-weight:700;color:var(--text);margin-bottom:4px}
.col-bar-track{width:100%;max-width:36px;flex:1 1 auto;display:flex;align-items:flex-end;background:#EEF1F4;border-radius:4px 4px 0 0;overflow:hidden}
.col-bar-fill{width:100%;border-radius:4px 4px 0 0;transition:height .2s}
.col-bar-label{font-size:10px;color:var(--muted);margin-top:6px;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc-cell{display:flex;align-items:center;gap:6px}
.loc-edit-btn{background:#EEF1F4;color:var(--navy);border:none;border-radius:5px;width:20px;height:20px;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto}
.loc-edit-btn:hover{background:#E2E7EC}
.loc-updated{font-size:10px;color:var(--muted);margin-top:2px}
.loc-edit-input{width:100%;padding:4px 6px;border:1px solid var(--border);border-radius:5px;font-size:12px;font-family:inherit;box-sizing:border-box}
.loc-edit-actions{display:flex;gap:4px;margin-top:4px}
.loc-btn-sm{border:none;border-radius:5px;padding:3px 8px;font-size:11px;cursor:pointer}
.loc-save-btn{background:var(--navy);color:#fff}
.loc-cancel-btn{background:#EEF1F4;color:var(--navy)}
.stat-list{margin-top:12px}.stat-item{display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:7px 0;font-size:12px}
.lock-notice{background:var(--amber-dim);color:var(--amber);border-radius:6px;padding:8px 10px;font-size:12px;font-weight:600;margin-bottom:12px;display:none}
  .btn-signoff{background:var(--blue-accent);color:#fff;border:1px solid var(--blue-accent);display:inline-flex;align-items:center;gap:6px;}
  .btn-signoff:hover{background:#255a94;}
  .btn-signoff:disabled{opacity:.5;cursor:default;background:#B9C7D9;border-color:#B9C7D9;color:#fff;}
  .btn-signoff svg{width:13px;height:13px;flex:0 0 auto;}
  .btn-confirm{background:var(--blue-accent);color:#fff;border:1px solid var(--blue-accent);}
  .btn-confirm:hover{background:#255a94;}
  .btn-approve{background:var(--green);color:#fff;border:1px solid var(--green);}
  .btn-approve:hover{background:#166b45;}
  .btn-notsign{background:var(--red);color:#fff;border:1px solid var(--red);}
  .btn-notsign:hover{background:#9c2e21;}
  .btn-cancel-plain{background:none;border:none;color:#B0B4BA;text-decoration:underline;padding:7px 10px;font-size:12px;font-weight:600;}
  .btn-cancel-plain:hover{color:#8A8F96;}
  .btn-unlock{background:#F1F2F4;color:var(--text);border:1px solid #E2E5E9;border-radius:999px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 1px 2px rgba(0,0,0,.06);}
  .btn-unlock:hover{background:#E7E9EC;}
  /* ===== Sign Status / Approval panel (ported from sign-status-approval-panel skill) ===== */
  .lock-notice{
    background:var(--amber-dim);color:var(--amber);border-radius:6px;padding:8px 10px;
    font-size:12px;font-weight:600;margin-bottom:12px;
  }
  input:disabled,select:disabled,textarea:disabled{background:#F2F4F6;color:var(--muted);cursor:default;}
  .dropzone.locked{opacity:.6;}

  .status-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.03em;}
  .status-pending{background:var(--amber-dim);color:var(--amber);}
  .status-approved{background:var(--green-dim);color:var(--green);}
  .status-rejected{background:var(--red-dim);color:var(--red);}

  .approval-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;}
  .approval-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .sig-stamp{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 14px;}
  .sig-stamp img{height:42px;}
  .sig-meta{font-size:12px;color:var(--sub);line-height:1.5;font-family:var(--mono);}
  .sig-meta b{color:var(--text);font-family:inherit;}

  .confirm-box{display:flex;align-items:center;gap:10px;background:var(--amber-dim);border:1px solid #f0d19c;border-radius:8px;padding:8px 12px;flex-wrap:wrap;}
  .confirm-box span{font-size:12px;color:var(--amber);font-weight:600;}
  .confirm-box input[type=password]{width:130px;}
  .confirm-box.reject-box{background:var(--red-dim);border-color:#f3c6c2;flex-direction:column;align-items:stretch;gap:8px;}
  .confirm-box.reject-box span{color:var(--red);}
  .confirm-box textarea{width:100%;min-height:56px;background:#fff;border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:12px;font-family:inherit;color:var(--text);resize:vertical;}
  .reject-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .pw-error{font-size:12px;color:var(--red);font-weight:600;}
  .approval-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.sign-box{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100}
.modal.show{display:flex}.modal-box{background:#fff;border-radius:10px;padding:20px;max-width:90vw;max-height:90vh;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal-box img{max-width:80vw;max-height:75vh;display:block;border-radius:6px}
.confirm-modal-box{background:#fff;border-radius:10px;padding:22px 26px;width:340px;max-width:90vw;box-shadow:0 10px 40px rgba(0,0,0,.25);text-align:left}
.confirm-modal-box p{margin:0 0 18px;font-size:14px;color:var(--text)}
.confirm-modal-actions{display:flex;justify-content:flex-end;gap:10px}
.btn-modal-no{background:#EEF1F4;color:var(--text)}.btn-modal-no:hover{background:#E2E7EC}
.btn-modal-yes{background:var(--warn);color:#fff}.btn-modal-yes:hover{background:#9c2e21}
/* Table text: No./Buyer/Category/Size/Year/Code/Photo/Location -> black, not bold (Code stays bold) */
.table-wrap td{color:#000;font-weight:400}
.table-wrap .chip{color:#000;font-weight:400}
.table-wrap .category-chip{color:#000;font-weight:700}
.table-wrap .code-cell{font-weight:400}
footer{margin-top:16px;text-align:center;font-size:12px;color:#8592A3}
.small-note{font-size:11px;color:#94A3B8;margin-top:5px}

/* Packing Chop Sign Status styling */
.lock-notice{background:var(--amber-dim);color:var(--amber);border-radius:6px;padding:8px 10px;font-size:12px;font-weight:600;margin-bottom:12px;}
input:disabled,select:disabled,textarea:disabled{background:#F2F4F6;color:var(--muted);cursor:default;}
.dropzone.locked{opacity:.6;}
.status-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.03em;}
.status-pending{background:var(--amber-dim);color:var(--amber);}.status-approved{background:var(--green-dim);color:var(--good);}.status-rejected{background:var(--red-dim);color:var(--warn);}
.approval-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;}.approval-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.sig-stamp{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 14px;}.sig-stamp img{height:42px;}
.sig-meta{font-size:12px;color:var(--muted);line-height:1.5;font-family:var(--mono);}.sig-meta b{color:var(--text);font-family:inherit;}
.confirm-box{display:flex;align-items:center;gap:10px;background:var(--amber-dim);border:1px solid #f0d19c;border-radius:8px;padding:8px 12px;flex-wrap:wrap;}.confirm-box span{font-size:12px;color:var(--amber);font-weight:600;}.confirm-box input[type=password]{width:130px;}
.confirm-box.reject-box{background:var(--red-dim);border-color:#f3c6c2;flex-direction:column;align-items:stretch;gap:8px;}.confirm-box.reject-box span{color:var(--warn);}.confirm-box textarea{width:100%;min-height:56px;background:#fff;border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:12px;font-family:inherit;color:var(--text);resize:vertical;}
.reject-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}.pw-error{font-size:12px;color:var(--warn);font-weight:600;}.approval-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.btn-signoff{background:var(--blue-accent);color:#fff;border:1px solid var(--blue-accent);display:inline-flex;align-items:center;gap:6px;}.btn-signoff:hover{background:#255a94;}.btn-signoff:disabled{opacity:.5;cursor:default;background:#B9C7D9;border-color:#B9C7D9;color:#fff;}.btn-signoff svg{width:13px;height:13px;flex:0 0 auto;}
.btn-confirm{background:var(--blue-accent);color:#fff;border:1px solid var(--blue-accent);}.btn-approve{background:var(--good);color:#fff;border:1px solid var(--good);}.btn-notsign{background:var(--warn);color:#fff;border:1px solid var(--warn);}.btn-cancel-plain{background:none;border:none;color:#B0B4BA;text-decoration:underline;padding:7px 10px;font-size:12px;font-weight:600;}
.sig-comment-input{border:1px solid transparent;background:transparent;border-radius:4px;padding:2px 4px;margin:0 0 0 -4px;font-size:12px;font-family:var(--mono);color:var(--muted);width:220px}
.sig-comment-input:hover{border-color:var(--border);background:#fff}
.sig-comment-input:focus{outline:2px solid #BBD3EC;border-color:var(--blue-accent);background:#fff;color:var(--text)}
.btn-nextsignoff{background:var(--blue-accent);color:#fff;border:1px solid var(--blue-accent);border-radius:999px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 1px 2px rgba(0,0,0,.06);}
.btn-nextsignoff:hover{background:#255a94;}
.sig-stamp{align-items:flex-start;}
.sig-meta{display:flex;flex-direction:column;gap:2px;}

/* QA Dummy input sizing: all six fields are equal and 2/3 of photo width */
.card:first-child input[type="text"], .card:first-child select { width:66.6667%; }


/* Right-side filters */
.search-wrap{position:relative;width:100%}
.search-wrap input{padding-left:34px!important}
.search-icon{
  position:absolute;left:11px;top:50%;transform:translateY(-52%);
  color:#7B8794;font-size:19px;line-height:1;pointer-events:none;font-weight:600
}
#filterBuyer,#filterCategory,#filterSize{width:100%}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#btnRefresh.spinning{pointer-events:none;opacity:.75}
#btnRefresh .refresh-icon{display:inline-block}
#btnRefresh.spinning .refresh-icon{animation:qa-refresh-spin .5s linear}
@keyframes qa-refresh-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.synced-badge{font-size:12px;font-weight:700;color:var(--good);opacity:0;transition:opacity .25s;display:inline-flex;align-items:center;gap:4px}
.synced-badge.show{opacity:1}

</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>QA DUMMY</h1>
    <div class="sub"></div>
  </div>
  <div class="actions">
    <button class="btn-export" id="btnExport">⭳ Export Excel</button>
  </div>
</header>

<div class="tab-bar">
  <div class="tab-btn active" data-section="LIST">QA Dummy List <span class="count" id="totalCount">0</span></div>
  <div class="tab-btn" data-section="SUMMARY">Summary</div>
  <span class="synced-badge" id="syncedBadge" style="margin-left:auto">✓ Synced</span>
  <button class="btn-export" id="btnRefresh"><span class="refresh-icon">⟳</span> Refresh</button>
</div>

<div class="grid" id="sectionGrid">
  <div class="card">
    <h2 class="card-title-plain">Add New Dummy</h2>

    <div class="dropzone" id="dropzone">
      <div id="dzPreview"></div>
      <div id="dzHint"></div>
      <div class="dz-actions">
        <button type="button" class="dz-btn" id="btnTakePhoto">📷 Take Photo</button>
        <button type="button" class="dz-btn" id="btnUploadFile">🖼 Upload from Device</button>
      </div>
      <input type="file" id="fileInput" accept="image/*" style="display:none">
      <input type="file" id="fileCamera" accept="image/*" capture="environment" style="display:none">
    </div>

    <label>Buyer</label>
    <input type="text" id="fBuyer" placeholder="e.g. A&F">

    <label>Category</label>
    <input type="text" id="fCategory" placeholder="e.g. T-Shirt">

    <label>Size</label>
    <input type="text" id="fSize" placeholder="e.g. M">

    <label>Year</label>
    <input type="text" id="fYear" placeholder="e.g. 2026">

    <label>Code</label>
    <input type="text" id="fCode" placeholder="e.g. DM-001">

    <label>Location</label>
    <input type="text" id="fLocation" placeholder="e.g. QA Room / Cabinet A">

    <button class="btn-primary" id="btnAdd" style="width:100%;margin-top:16px">+ Add to list</button>
  </div>

  <div class="card">
    <div class="top-row">
      <div class="field" style="max-width:170px">
        <label>Buyer</label>
        <select id="filterBuyer"><option value="ALL">All</option></select>
      </div>
      <div class="field" style="max-width:170px">
        <label>Category</label>
        <select id="filterCategory"><option value="ALL">All</option></select>
      </div>
      <div class="field" style="max-width:170px">
        <label>Size</label>
        <select id="filterSize"><option value="ALL">All</option></select>
      </div>
      <div class="field search-field">
        <label>Search</label>
        <div class="search-wrap">
          <span class="search-icon">⌕</span>
          <input type="text" id="searchInput" placeholder="Search Code / Year / Location...">
        </div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr>
          <th style="width:42px">No.</th>
          <th style="width:85px">Photo</th>
          <th style="width:85px">Buyer</th>
          <th style="width:85px">Category</th>
          <th style="width:85px">Size</th>

function esc(v){
  return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function titleCase(v){

const _scriptCache={};
function loadScriptOnce(src){
  if(!_scriptCache[src]){
    _scriptCache[src]=new Promise((resolve,reject)=>{
      const s=document.createElement('script');
      s.src=src;
      s.onload=()=>resolve();
      s.onerror=()=>{delete _scriptCache[src];reject(new Error('Failed to load '+src));};
      document.head.appendChild(s);
    });
  }
  return _scriptCache[src];
}

function drawPieChart(containerId, dataArr){
  const el=$(containerId);
  if(!el)return;
  const total=dataArr.reduce((s,d)=>s+d.value,0);
  if(!total){el.innerHTML='<div class="small-note" style="padding:20px 0;text-align:center">No data</div>';return;}
  const cx=130,cy=100,r=62,elbowR=r+14,legLen=16;
  let angle=-Math.PI/2, paths='', leaders='';
  dataArr.forEach((d,i)=>{
    const sweep=(d.value/total)*Math.PI*2;
    const end=angle+sweep;
    const color=CHART_COLORS[i%CHART_COLORS.length];
    const pct=d.value/total*100;
    const mid=dataArr.length===1?-Math.PI/2:angle+sweep/2;
    if(dataArr.length===1){
      paths+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}"><title>${esc(d.label)}: ${d.value} (100%)</title></circle>`;
    }else{
      const x1=(cx+r*Math.cos(angle)).toFixed(2), y1=(cy+r*Math.sin(angle)).toFixed(2);
      const x2=(cx+r*Math.cos(end)).toFixed(2), y2=(cy+r*Math.sin(end)).toFixed(2);
      const largeArc=sweep>Math.PI?1:0;
      paths+=`<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${largeArc} 1 ${x2},${y2} Z" fill="${color}" stroke="#fff" stroke-width="1"><title>${esc(d.label)}: ${d.value} (${pct.toFixed(2)}%)</title></path>`;
    }
    // Data label chĩa ra ngoài bằng đường dẫn gấp khúc (leader line), vòng tròn giữ nguyên tròn đều
    const ex=cx+r*Math.cos(mid), ey=cy+r*Math.sin(mid);
    const elx=cx+elbowR*Math.cos(mid), ely=cy+elbowR*Math.sin(mid);
    const side=Math.cos(mid)>=0?1:-1;
    const lx=elx+side*legLen, ly=ely;
    leaders+=`<polyline points="${ex.toFixed(2)},${ey.toFixed(2)} ${elx.toFixed(2)},${ely.toFixed(2)} ${lx.toFixed(2)},${ly.toFixed(2)}" fill="none" stroke="${color}" stroke-width="1"/>`;
    const textX=lx+side*3;
    leaders+=`<text x="${textX.toFixed(2)}" y="${ly.toFixed(2)}" text-anchor="${side>0?'start':'end'}" dominant-baseline="middle" font-size="9" font-weight="400" fill="${color}">${esc(d.label)} ${pct.toFixed(2)}%</text>`;
    angle=end;
  });
  el.innerHTML=`<div style="display:flex;justify-content:flex-end;padding-right:42px"><svg viewBox="0 8 260 189" width="296" height="215" style="flex:0 0 auto;overflow:visible">${paths}${leaders}</svg></div>`;
}

/* ===== AI Label Reading (image → Buyer/Category/Size/Year/Code) =====
 * OCR chạy ngay trong trình duyệt bằng Tesseract.js (giống Packing Chop
 * dashboard) — không gọi server/API key nào cả. Nhãn size thường có bố cục:
 *   Dòng 1: Category (trái)  ......  Year (phải, 4 chữ số)
 *   Dòng 2: Size (số lớn, canh giữa)
 *   Dòng 3: Buyer
 *   Dòng cuối: Code
 * Đây là suy luận heuristic dựa trên thứ tự dòng chữ đọc được — kết quả là
 * gợi ý, người dùng vẫn cần kiểm tra lại trước khi Add (UI đã nhắc sẵn). */
const BUYER_MAP=[
  [/WAL[\s-]?MART|WALMART/i,'Wal-Mart'],
  [/AMERICAN\s+EAGLE|AERIE/i,'AEO'],
  [/\bGAP\b|OLD\s+NAVY/i,'GAP / OLD NAVY'],
  [/HOLLISTER|ABERCROMBIE/i,'A&F'],
  [/EXPRESS/i,'Express'],
  [/TARGET/i,'Target'],
  [/LA\s+SENZA|VICTORIA.?S\s+SECRET/i,'Pink'],
  [/JC\s*PENN(E)?Y/i,'JCP'],
];
function normalizeBuyer(raw){
  const s=String(raw||'').toUpperCase();
  for(const[re,name] of BUYER_MAP){ if(re.test(s)) return name; }
  return String(raw||'').trim();
}

let ocrWorkerPromise=null;
function getOcrWorker(){
  if(!ocrWorkerPromise){
    ocrWorkerPromise=Tesseract.createWorker('eng').then(async(worker)=>{
      await worker.setParameters({
        tessedit_ocr_engine_mode:'1', // LSTM only — nhanh hơn engine cũ
        tessedit_pageseg_mode:'6' // coi nhãn là 1 khối văn bản nhiều dòng
      });
      return worker;
    });
  }
  return ocrWorkerPromise;
}
// Tải sẵn Tesseract.js + khởi động worker lúc rảnh (idle) để lần đọc ảnh
// đầu tiên của người dùng không phải chờ tải thư viện.
function warmUpOcrEngine(){
  const start=()=>{ ensureTesseract().then(()=>getOcrWorker()).catch(()=>{}); };
  if('requestIdleCallback' in window) requestIdleCallback(start,{timeout:4000});
  else setTimeout(start,1500);
}
warmUpOcrEngine();

// Chuyển ảnh xám + tăng tương phản (percentile 1–99%) hoặc nhị phân hóa
// (Otsu threshold) để chữ trên nhãn rõ hơn trước khi OCR — ảnh chụp bằng
// điện thoại thường bị bóng/thiếu sáng làm giảm tương phản chữ với nền.
function preprocessForOcr(sourceCanvas,{binarize=true}={}){
  const c=document.createElement('canvas');
  c.width=sourceCanvas.width;c.height=sourceCanvas.height;
  const ctx=c.getContext('2d');
  ctx.drawImage(sourceCanvas,0,0);
  const imgData=ctx.getImageData(0,0,c.width,c.height);
  const d=imgData.data;
  const n=d.length/4;
  const gray=new Uint8ClampedArray(n);
  const hist=new Array(256).fill(0);
  for(let i=0,j=0;i<d.length;i+=4,j++){
    const v=(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2])|0;
    gray[j]=v;hist[v]++;
  }
  if(!binarize){
    const total=n;let cum=0,lowP=0,highP=255;
    const lowTarget=total*0.01,highBudget=total*0.01;
    for(let t=0;t<256;t++){cum+=hist[t];if(cum>=lowTarget){lowP=t;break;}}
    cum=0;
    for(let t=255;t>=0;t--){cum+=hist[t];if(cum>=highBudget){highP=t;break;}}
    const range=Math.max(1,highP-lowP);
    for(let i=0,j=0;i<d.length;i+=4,j++){
      let v=Math.round((gray[j]-lowP)*255/range);
      if(v<0)v=0;else if(v>255)v=255;
      d[i]=d[i+1]=d[i+2]=v;
    }
    ctx.putImageData(imgData,0,0);
    return c;
  }
  let sum=0;
  for(let t=0;t<256;t++)sum+=t*hist[t];
  let sumB=0,wB=0,varMax=0,threshold=127;
  for(let t=0;t<256;t++){
    wB+=hist[t];if(wB===0)continue;
    const wF=n-wB;if(wF===0)break;
    sumB+=t*hist[t];
    const mB=sumB/wB,mF=(sum-sumB)/wF;
    const varBetween=wB*wF*(mB-mF)*(mB-mF);
    if(varBetween>varMax){varMax=varBetween;threshold=t;}
  }
  for(let i=0,j=0;i<d.length;i+=4,j++){
    const v=gray[j]>threshold?255:0;
    d[i]=d[i+1]=d[i+2]=v;
  }
  ctx.putImageData(imgData,0,0);
  return c;
}

// Crop vùng giữa ảnh rồi phóng to lại — ảnh chụp điện thoại thường có
// nhãn chỉ chiếm 1 phần nhỏ giữa khung hình, crop bớt nền/tay/bao bì xung
// quanh giúp chữ có nhiều pixel thật hơn để đọc.
function centerCropUpscale(sourceCanvas,cropFraction,minTargetDim){
  const cw=Math.max(1,Math.round(sourceCanvas.width*cropFraction));
  const ch=Math.max(1,Math.round(sourceCanvas.height*cropFraction));
  const sx=Math.round((sourceCanvas.width-cw)/2);
  const sy=Math.round((sourceCanvas.height-ch)/2);
  const shortSide=Math.min(cw,ch);
  const scale=Math.max(1,minTargetDim/shortSide);
  const outW=Math.round(cw*scale),outH=Math.round(ch*scale);
  const c=document.createElement('canvas');
  c.width=outW;c.height=outH;
  const ctx=c.getContext('2d');
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  ctx.drawImage(sourceCanvas,sx,sy,cw,ch,0,0,outW,outH);
  return c;
}

// Suy luận Category/Size/Year/Buyer/Code từ text OCR đọc được.
// Nhãn thực tế thường có dạng:
//   Dòng 1: CATEGORY + SIZE (số lớn) + YEAR   (vd "GIRL REGULAR 8 2006")
//   Dòng kế: tên nhãn hàng (vd "WAL-MART")
//   Dòng dưới: mã nội bộ (bỏ qua) rồi đến mã tham chiếu cuối (vd "AVF76519")
function parseSizeLabelText(rawText){
  const lines=String(rawText||'').split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>0);
  if(!lines.length) return {category:'',size:'',year:'',buyer:'',code:''};

  // Năm: quét từng dòng, ưu tiên dòng đầu tiên có chứa năm hợp lệ — đó
  // chính là dòng tiêu đề chứa Category + Size.
  let yearLineIdx=-1,year='';
  for(let i=0;i<lines.length;i++){
    const m=lines[i].match(/\b(19|20)\d{2}\b/);
    if(m){year=m[0];yearLineIdx=i;break;}
  }
  const labelLine=yearLineIdx!==-1?lines[yearLineIdx]:lines[0];

  // Bỏ năm ra khỏi dòng tiêu đề, phần còn lại là Category + Size.
  let rest=year?labelLine.replace(year,' '):labelLine;
  const sizeMatch=rest.match(/(?:^|\s)([0-9]{1,3}[A-Za-z]{0,2})(?:\s|$)/);
  const size=sizeMatch?sizeMatch[1].toUpperCase():'';
  let category=size?rest.replace(sizeMatch[0],' '):rest;
  category=category.replace(/[^A-Za-z\s]/g,' ').replace(/\s+/g,' ').trim();

  // Buyer: tìm dòng có chứa tên nhãn hàng quen thuộc, bỏ qua dòng tiêu đề.
  let buyer='';
  for(let i=0;i<lines.length;i++){
    if(i===yearLineIdx)continue;
    if(BUYER_MAP.some(([re])=>re.test(lines[i]))){buyer=lines[i];break;}
  }
  if(!buyer&&yearLineIdx!==-1&&lines[yearLineIdx+1]&&!/[0-9]{3,}/.test(lines[yearLineIdx+1])){
    buyer=lines[yearLineIdx+1];
  }

  // Code: quét từ dòng cuối lên, ưu tiên dòng khớp mẫu "vài chữ + nhiều số"
  // (vd "AVF76519") — mẫu chuẩn của mã tham chiếu trên nhãn; nếu không có
  // dòng nào khớp mẫu chuẩn thì mới dùng cách đoán lỏng hơn (chữ+số, ít
  // ký tự lạ) để tránh nhặt nhầm mã nội bộ hoặc nhiễu OCR.
  let code='';
  for(let i=lines.length-1;i>=0;i--){
    if(i===yearLineIdx)continue;
    const alnum=lines[i].replace(/\s+/g,'').replace(/[^A-Za-z0-9]/g,'').toUpperCase();
    if(/^[A-Z]{1,4}[0-9]{4,8}$/.test(alnum)){code=alnum;break;}
  }
  if(!code){
    for(let i=lines.length-1;i>=0;i--){
      if(i===yearLineIdx)continue;
      const cleaned=lines[i].replace(/\s+/g,'');
      const alnum=cleaned.replace(/[^A-Za-z0-9]/g,'');
      if(alnum.length>=5&&alnum.length/cleaned.length>0.7){code=alnum.toUpperCase();break;}
    }
  }
  if(!code&&lines.length>1)code=lines[lines.length-1].replace(/\s+/g,'').toUpperCase();

  return {category,size,year,buyer,code};
}
function isValidSizeResult(r){ return !!(r&&r.category&&r.size&&r.year&&r.code); }
function scoreSizeResult(r){
  if(!r) return -1;
  let s=0;
  if(r.category)s++; if(r.size)s++; if(r.year)s++; if(r.buyer)s++; if(r.code)s++;
  return s;
}
async function ocrRecognizeText(worker,canvas,psm){
  if(psm) await worker.setParameters({tessedit_pageseg_mode:psm});
  const {data}=await worker.recognize(canvas);
  return (data&&data.text)?data.text:'';
}
// Đọc riêng 1 vùng ảnh chỉ chứa chữ số (dùng whitelist để Tesseract không
// đoán nhầm số thành chữ cái tương tự, vd "0"→"O", "8"→"B").
async function ocrDigitsOnly(worker,canvas){
  await worker.setParameters({tessedit_pageseg_mode:'7',tessedit_char_whitelist:'0123456789'});
  const {data}=await worker.recognize(canvas);
  const digits=(data&&data.text)?data.text.replace(/\D/g,''):'';
  await worker.setParameters({tessedit_char_whitelist:''});
  return digits;
}
function cropCanvas(source,x,y,w,h,pad){
  pad=pad||0;
  const sx=Math.max(0,Math.round(x-pad)),sy=Math.max(0,Math.round(y-pad));
  const ex=Math.min(source.width,Math.round(x+w+pad)),ey=Math.min(source.height,Math.round(y+h+pad));
  const cw=Math.max(1,ex-sx),ch=Math.max(1,ey-sy);
  const c=document.createElement('canvas');c.width=cw;c.height=ch;
  c.getContext('2d').drawImage(source,sx,sy,cw,ch,0,0,cw,ch);
  return c;
}
function upscaleCanvas(source,minDim){
  const shortSide=Math.min(source.width,source.height);
  if(shortSide>=minDim) return source;
  const scale=minDim/Math.max(1,shortSide);
  const c=document.createElement('canvas');
  c.width=Math.round(source.width*scale);c.height=Math.round(source.height*scale);
  const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  ctx.drawImage(source,0,0,c.width,c.height);
  return c;
}
// Tìm vùng chữ số màu cam đậm (số size nổi bật trên nhãn, vd "8","9","40")
// trong nửa trên của ảnh — tách riêng vùng này ra để đọc số chính xác hơn
// nhiều so với đọc chung cả dòng lẫn chữ nhỏ lẫn số lớn.
function findOrangeBBox(canvas){
  const w=canvas.width,h=canvas.height;
  const searchH=Math.round(h*0.55);
  if(w<1||searchH<1) return null;
  const ctx=canvas.getContext('2d');
  const d=ctx.getImageData(0,0,w,searchH).data;
  let minX=w,minY=searchH,maxX=0,maxY=0,count=0;
  for(let y=0;y<searchH;y++){
    for(let x=0;x<w;x++){
      const i=(y*w+x)*4;
      const r=d[i],g=d[i+1],b=d[i+2];
      if(r>150&&b<120&&(r-b)>70&&(r-g)>25&&g<190){
        count++;
        if(x<minX)minX=x;if(x>maxX)maxX=x;
        if(y<minY)minY=y;if(y>maxY)maxY=y;
      }
    }
  }
  const minPixels=Math.max(20,Math.round(w*searchH*0.002));
  if(count<minPixels) return null;
  return {x:minX,y:minY,w:(maxX-minX+1),h:(maxY-minY+1)};
}
function dataUrlToCanvas(dataUrl){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      c.width=img.naturalWidth||img.width;c.height=img.naturalHeight||img.height;
      c.getContext('2d').drawImage(img,0,0);
      resolve(c);
    };
    img.onerror=()=>reject(new Error('Không thể đọc ảnh.'));
    img.src=dataUrl;
  });
}
async function ocrExtractSizeLabel(canvas){
  if(typeof Tesseract==='undefined'){
    setDzStatus('⏳ Đang tải OCR engine...');
    try{ await ensureTesseract(); }
    catch(e){ throw new Error('Không tải được OCR engine — kiểm tra kết nối mạng'); }
  }
  setDzStatus('⏳ Đang đọc nhãn...');
  const worker=await getOcrWorker();

  // Bước 1: cô lập số cỡ màu cam trên dòng tiêu đề (nếu tìm thấy) và đọc
  // riêng phần chữ bên trái/phải số đó — tách bạch giúp đọc chính xác hơn
  // là đọc chung cả dòng có cỡ chữ to nhỏ lẫn lộn.
  let colorSize='',colorCategory='',colorYear='';
  try{
    const bbox=findOrangeBBox(canvas);
    if(bbox){
      const digitCrop=upscaleCanvas(cropCanvas(canvas,bbox.x,bbox.y,bbox.w,bbox.h,Math.round(bbox.h*0.25)),160);
      colorSize=await ocrDigitsOnly(worker,digitCrop);

      const bandTop=Math.max(0,bbox.y-Math.round(bbox.h*0.35));
      const bandBottom=Math.min(canvas.height,bbox.y+bbox.h+Math.round(bbox.h*0.35));
      const bandH=bandBottom-bandTop;
      if(bbox.x>10){
        const leftCrop=upscaleCanvas(cropCanvas(canvas,0,bandTop,bbox.x,bandH,4),240);
        const leftText=await ocrRecognizeText(worker,preprocessForOcr(leftCrop,{binarize:false}),'7');
        colorCategory=leftText.replace(/[^A-Za-z\s]/g,' ').replace(/\s+/g,' ').trim();
      }
      if(bbox.x+bbox.w<canvas.width-10){
        const rightCrop=upscaleCanvas(cropCanvas(canvas,bbox.x+bbox.w,bandTop,canvas.width-(bbox.x+bbox.w),bandH,4),240);
        const rightText=await ocrRecognizeText(worker,preprocessForOcr(rightCrop,{binarize:false}),'7');
        const ym=rightText.match(/\b(19|20)\d{2}\b/);
        colorYear=ym?ym[0]:'';
      }
    }
  }catch(e){ console.error('[QA OCR] Đọc vùng số màu cam thất bại:',e); }

  // Bước 2: đọc toàn bộ nhãn (nhiều dòng) để lấy Buyer/Code, và làm
  // phương án dự phòng cho Category/Size/Year nếu bước 1 không tách được.
  let best=null;
  function tryUpdate(result){
    if(isValidSizeResult(result)) return result;
    if(scoreSizeResult(result)>scoreSizeResult(best)) best=result;
    return null;
  }
  const attempts=[
    ()=>preprocessForOcr(canvas,{binarize:true}),
    ()=>preprocessForOcr(centerCropUpscale(canvas,0.7,1200),{binarize:true}),
    ()=>preprocessForOcr(canvas,{binarize:false}),
    ()=>preprocessForOcr(centerCropUpscale(canvas,0.7,1200),{binarize:false}),
  ];
  let hit=null;
  for(const buildCanvas of attempts){
    const text=await ocrRecognizeText(worker,buildCanvas(),'6');
    console.log('[QA OCR] raw text:',JSON.stringify(text));
    hit=tryUpdate(parseSizeLabelText(text));
    if(hit) break;
  }
  await worker.setParameters({tessedit_pageseg_mode:'6'});

  const result=hit||best||{category:'',size:'',year:'',buyer:'',code:''};
  // Ưu tiên Category/Size/Year đọc riêng từ vùng số màu cam vì đáng tin
  // cậy hơn cách đoán theo dòng ở bước 2.
  if(colorSize) result.size=colorSize;
  if(colorYear) result.year=colorYear;
  if(colorCategory) result.category=colorCategory;
  return result;
}
async function ocrLabel(dataUrl){
  const canvas=await dataUrlToCanvas(dataUrl);
  return ocrExtractSizeLabel(canvas);
}

function setDzStatus(html){$('dzHint').innerHTML=html?`<div class="small-note">${html}</div>`:'';}
function renderDzPreview(){$('dzPreview').innerHTML=state.pendingImage?`<img src="${state.pendingImage}" alt="Preview nhãn size">`:'';}

function resizeImageDataUrl(dataUrl, maxDim, quality){
  maxDim = maxDim || 1000; quality = quality || 0.72;
  return new Promise((resolve)=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width, h=img.height;
      if(w>maxDim||h>maxDim){
        if(w>h){h=Math.round(h*maxDim/w);w=maxDim;}
        else{w=Math.round(w*maxDim/h);h=maxDim;}
      }
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg',quality));
    };
    img.onerror=()=>resolve(dataUrl);
    img.src=dataUrl;
  });
}

async function processImage(file){
  if(!file)return;
  if(!file.type||!file.type.startsWith('image/')){alert('Vui lòng chọn file hình ảnh.');return;}
  const reader=new FileReader();
  reader.onload=async()=>{
    state.pendingImage=await resizeImageDataUrl(reader.result);
    renderDzPreview();
    setDzStatus('⏳ Loading...');
    try{
      const r=await ocrLabel(state.pendingImage);
      $('fCategory').value=r.category||'';
      $('fSize').value=r.size||'';
      $('fYear').value=r.year||'';
      $('fCode').value=r.code||'';
      $('fBuyer').value=normalizeBuyer(r.buyer||'');
      setDzStatus('');
    }catch(err){
      console.error(err);
      const detail=(err&&err.message)?err.message:String(err);
      setDzStatus('⚠ Không tự đọc được nhãn (' + esc(detail) + ') — vui lòng nhập tay các trường bên dưới.');
    }
  };
  reader.onerror=()=>alert('Không thể đọc file ảnh, vui lòng thử lại.');
  reader.readAsDataURL(file);
}

function addEntry(){
  const buyer=$('fBuyer').value.trim();
  const category=$('fCategory').value.trim();
  const size=$('fSize').value.trim();
  const year=$('fYear').value.trim();
  const code=$('fCode').value.trim();
  const location=$('fLocation').value.trim();
  if(!buyer||!category||!size||!year||!code){alert('Vui lòng nhập đủ Buyer, Category, Size, Year, Code trước khi Add.');return;}
  const entryData={buyer,category,size,year,code,location,imageDataUrl:state.pendingImage||null};
  const btn=$('btnAdd'); const btnLabel=btn?btn.textContent:'';
  if(btn){btn.disabled=true;btn.textContent='Saving...';}
  trackOp(gsRun('addEntry', entryData))
    .then(function(data){
      if(btn){btn.disabled=false;btn.textContent=btnLabel;}
      ['fBuyer','fCategory','fSize','fYear','fCode','fLocation'].forEach(id=>{$(id).value='';});
      state.pendingImage=null;
      renderDzPreview();
      setDzStatus('');
      applyServerData(data);
      ensurePendingBatch('QA Dummy update');
      persistSignBatches();
    })
    .catch(function(err){
      if(btn){btn.disabled=false;btn.textContent=btnLabel;}
      console.error(err);
      const detail=(err&&err.message)?err.message:String(err);
      alert('Không thể lưu dữ liệu lên server, vui lòng thử lại.\n\nChi tiết lỗi: ' + detail);
    });
}

function removeEntry(id){
  state.pendingDeleteId=id;
  $('deleteModal').classList.add('show');
}
function cancelDeleteEntry(){
  state.pendingDeleteId=null;
  $('deleteModal').classList.remove('show');
}
function confirmDeleteEntry(){
  const id=state.pendingDeleteId;
  $('deleteModal').classList.remove('show');
  state.pendingDeleteId=null;
  if(!id)return;
  const idx=state.entries.findIndex(e=>e.id===id);
  if(idx===-1)return;
  // Xóa ngay trên giao diện để phản hồi tức thì, đồng bộ thật với server ở nền
  // (không cần chờ round-trip mạng mới thấy dòng biến mất).
  state.entries.splice(idx,1);
  dataVersion++;
  render();
  trackOp(gsRun('deleteEntry', id))
    .then(function(data){
      applyServerData(data);
      ensurePendingBatch('QA Dummy update');
      persistSignBatches();
    })
    .catch(function(err){
      console.error(err);
      alert('Không thể xóa trên server, vui lòng thử lại.');
      load(); // đồng bộ lại đúng dữ liệu thật từ server nếu xóa thất bại
    });
}

function showPhoto(src){

  // Hiển thị phóng to gấp đôi kích thước gốc của ảnh khi xem trong modal;
  // KHÔNG ảnh hưởng đến ảnh lưu trữ hay ảnh chèn vào file Excel khi export

function ensureExcelJS(){

}

// Dựng file Excel (đúng format template QA_Dummy_List.xlsx) trong bộ nhớ, trả về buffer.
// Hàm này KHÔNG tải file xuống — chỉ build workbook để dùng lại cho cache hoặc export trực tiếp.

  ];

  ws.mergeCells('A1:H1');
  const titleCell=ws.getCell('A1');
  titleCell.value='QA DUMMY UPDATE';
  titleCell.font={name:'Calibri',size:16,bold:true};

  ws.getRow(1).height=20.25;

  const updatedCell=ws.getCell('A2');
  updatedCell.value=`Updated: ${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  updatedCell.font={name:'Calibri',size:10,italic:true};
  updatedCell.alignment={vertical:'middle'};
  ws.getRow(2).height=20.25;

  const headers=['No.','Photo','Buyer','Category','Size','Year','Code','Location'];
  const headerRow=ws.getRow(3);
  headers.forEach((h,i)=>{
    const cell=headerRow.getCell(i+1);
    cell.value=h;
    cell.font={name:'Calibri',size:10,bold:true};
    cell.alignment={horizontal:'center',vertical:'middle',wrapText:true};
    cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:HEADER_FILL}};

  ws.views=[{state:'frozen',ySplit:3,showGridLines:false}];

  const entries=state.entries;

  // Chỉ tải các ảnh CHƯA có trong cache (ảnh không đổi giữa các lần build thì khỏi tải lại),
  // và tải song song (batch) thay vì tuần tự từng ảnh -> giảm mạnh thời gian build,
  // đồng thời đỡ chiếm dụng lâu kết nối tới Apps Script (vốn dùng chung với các thao tác Add/Delete...).
  const missingIds=[...new Set(entries.filter(e=>e.imageFileId && !imageCache.has(e.imageFileId)).map(e=>e.imageFileId))];
  const BATCH_SIZE=4;
  for(let i=0;i<missingIds.length;i+=BATCH_SIZE){
    const batch=missingIds.slice(i,i+BATCH_SIZE);
    await Promise.all(batch.map(async fid=>{
      try{
        const img=await gsRun('getImageBase64', fid);
        imageCache.set(fid,img);
      }catch(err){console.error('Không tải được ảnh', fid, err);}
    }));
  }

  for(let i=0;i<entries.length;i++){
    const e=entries[i];
    const r=4+i;
    const row=ws.getRow(r);
    row.getCell(1).value={formula:'ROW()-3'};
    row.getCell(2).value='';
    row.getCell(3).value=e.buyer||'';
    row.getCell(4).value=e.category||'';
    row.getCell(5).value=e.size||'';
    row.getCell(6).value=e.year||'';
    row.getCell(7).value=e.code||'';
    row.getCell(8).value=e.location||'';
    for(let c=1;c<=8;c++){
      const cell=row.getCell(c);
      cell.font={name:'Calibri',size:10};
      cell.alignment={horizontal:'center',vertical:'middle',wrapText:true};
      cell.border=thinBorder;
    }
    const img=e.imageFileId?imageCache.get(e.imageFileId):null;
    if(img){
      try{
        const ext=(img.mimeType||'image/jpeg').split('/')[1]==='jpg'?'jpeg':(img.mimeType||'image/jpeg').split('/')[1];
        const imgId=wb.addImage({base64:img.base64,extension:ext});
        // Neo ảnh từ góc trên-trái tới góc dưới-phải của ô Photo -> ảnh luôn fit khít và canh giữa trong ô
        ws.addImage(imgId,{tl:{col:1,row:r-1},br:{col:2,row:r},editAs:'oneCell'});
        row.height=119.25;
      }catch(err){console.error(err);row.height=20.25;}
    }else{
      row.height=20.25;
    }
  }

  const totalRowIdx=4+entries.length;
  ws.mergeCells(`A${totalRowIdx}:F${totalRowIdx}`);
  for(let c=1;c<=8;c++){
    const cell=ws.getCell(totalRowIdx,c);
    cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:TOTAL_FILL}};
    cell.border=thinBorder;
    cell.font={name:'Calibri',size:10,bold:true};
    cell.alignment={horizontal:'center',vertical:'middle'};
  }
  ws.getCell(`A${totalRowIdx}`).value='Total';
  ws.getCell(`G${totalRowIdx}`).value=entries.length?{formula:`COUNTA(A4:A${totalRowIdx-1})`,result:entries.length}:0;
  ws.getRow(totalRowIdx).height=21.75;

  return await wb.xlsx.writeBuffer();
}

function downloadWorkbookBuffer(buf){
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='QA_Dummy_List.xlsx';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

// Điền template Excel ngầm mỗi khi dữ liệu thay đổi (thêm/xóa/sửa/ký duyệt),
// để lúc bấm "Export Excel" chỉ cần tải file đã dựng sẵn thay vì build lại từ đầu.
// Luôn nhường ưu tiên cho các thao tác của người dùng (Add/Delete/Edit/Sign) đang gọi
// server, để những thao tác đó phản hồi nhanh thay vì phải chờ sau việc điền template.
let _exportPrefillTimer=null;
function scheduleExportPrefill(delay){
  clearTimeout(_exportPrefillTimer);
  _exportPrefillTimer=setTimeout(()=>{prefillExportCache();}, delay??500);
}
async function prefillExportCache(){
  if(exportCache.building) return;
  if(exportCache.version===dataVersion) return; // đã sẵn sàng
  if(activeUserOps>0){ scheduleExportPrefill(300); return; } // có thao tác người dùng đang chạy -> đợi
  exportCache.building=true;
  const myVersion=dataVersion;
  try{
    const buf=await buildExportWorkbookBuffer();
    if(myVersion===dataVersion){
      exportCache.buffer=buf;
      exportCache.version=myVersion;
    }
  }catch(err){
    console.error('Điền template Excel ngầm thất bại (sẽ build lại khi bấm Export):', err);
  }finally{
    exportCache.building=false;
    if(myVersion!==dataVersion) scheduleExportPrefill(); // dữ liệu đổi tiếp trong lúc build -> build lại
  }
}

async function exportExcel(){
  const btnEx=$('btnExport');
  const btnExLabel=btnEx?(btnEx.dataset.label||btnEx.textContent):'';
  if(btnEx && !btnEx.dataset.label) btnEx.dataset.label=btnExLabel;

  // Template đã được điền ngầm sẵn (khớp dữ liệu hiện tại) -> tải ngay, không cần chờ.
  if(exportCache.buffer && exportCache.version===dataVersion){
    downloadWorkbookBuffer(exportCache.buffer);
    return;
  }

  // Chưa có cache hợp lệ (lần đầu, hoặc dữ liệu vừa đổi) -> build ngay lúc này.
  if(btnEx){btnEx.disabled=true;btnEx.textContent='Đang xuất...';}
  try{
    const myVersion=dataVersion;
    const buf=await buildExportWorkbookBuffer();
    downloadWorkbookBuffer(buf);
    if(myVersion===dataVersion){exportCache.buffer=buf;exportCache.version=myVersion;}
  }catch(err){
    console.error(err);
    alert('Xuất Excel thất bại, vui lòng thử lại.');
  }finally{
    if(btnEx){btnEx.disabled=false;btnEx.textContent=btnEx.dataset.label||btnExLabel;}
  }
}

load();
$('btnAdd').onclick=addEntry;
$('btnUploadFile').onclick=()=>$('fileInput').click();
$('btnTakePhoto').onclick=()=>$('fileCamera').click();
$('fileInput').onchange=e=>processImage(e.target.files[0]);
$('fileCamera').onchange=e=>processImage(e.target.files[0]);
$('dropzone').ondragover=e=>{e.preventDefault();$('dropzone').classList.add('drag')};
$('dropzone').ondragleave=()=> $('dropzone').classList.remove('drag');
$('dropzone').ondrop=e=>{e.preventDefault();$('dropzone').classList.remove('drag');processImage(e.dataTransfer.files[0])};
$('filterBuyer').onchange=e=>{state.filterBuyer=e.target.value;render()};
$('filterCategory').onchange=e=>{state.filterCategory=e.target.value;render()};
$('filterSize').onchange=e=>{state.filterSize=e.target.value;render()};
$('searchInput').oninput=e=>{state.search=e.target.value;render()};
$('btnExport').onclick=exportExcel;
$('btnRefresh').onclick=()=>{
  const btn=$('btnRefresh');
  btn.classList.remove('spinning');
  void btn.offsetWidth; // buộc reflow để animation luôn chạy lại từ đầu kể cả bấm liên tục
  btn.classList.add('spinning');
  trackOp(gsRun('getData'))
    .then(function(data){
      applyServerData(data);
      showSyncedBadge();
    })
    .catch(function(err){
      console.error(err);
      showToast('⚠ Không thể làm mới, vui lòng thử lại');
    });
  setTimeout(()=>btn.classList.remove('spinning'),500);
};
function showSyncedBadge(){
  const b=$('syncedBadge');
  if(!b)return;
  b.classList.add('show');
  clearTimeout(showSyncedBadge._timer);
  showSyncedBadge._timer=setTimeout(()=>b.classList.remove('show'),2000);
}
function showToast(msg){
  const t=$('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer=setTimeout(()=>t.classList.remove('show'),1800);
}
$('closeModal').onclick=()=>$('photoModal').classList.remove('show');
$('photoModal').onclick=e=>{if(e.target.id==='photoModal')e.currentTarget.classList.remove('show')};
$('deleteNo').onclick=cancelDeleteEntry;
$('deleteYes').onclick=confirmDeleteEntry;
$('deleteModal').onclick=e=>{if(e.target.id==='deleteModal')cancelDeleteEntry();};
document.querySelectorAll('.tab-btn').forEach(t=>t.onclick=()=>{
  state.activeSection=t.dataset.section;
  document.querySelectorAll('.tab-btn').forEach(x=>x.classList.toggle('active',x===t));
  render();
});
